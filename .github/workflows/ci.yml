# Run the existing regression suite before merge.
#
# The CI inventory is documented in test/README.md. Run each listed CI suite
# on every PR and push to main, before a bad change can reach the Pages deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseding a PR push mid-run is fine to cancel — unlike a Pages deploy,
# there is nothing here that needs to finish once started.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20

      # No committed package.json/lockfile — the app itself stays
      # dependency-free (see test/README.md). Install fresh into this
      # ephemeral container instead of keeping a lockfile in sync.
      - name: Install Playwright
        run: |
          npm install -D playwright@latest
          npx playwright install --with-deps chromium

      - name: Serve the app
        run: |
          python3 -m http.server 8000 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/index.html > /dev/null && break
            sleep 0.5
          done

      # tokens.js needs no browser and no server: it parses the shipped files
      # and reproduces every UIUX §2 table from the declared hexes (PRD §9.6).
      # First, so a broken design contract fails before a Chromium ever boots.
      - name: tokens.js
        run: node test/tokens.js

      # records.js is the second browserless suite: it guards DECISIONS.md's
      # `### B<n>` citation space (no duplicate, ascending, the glow ruling is
      # B132) — issue #272. Also first, for the same reason.
      - name: records.js
        run: node test/records.js

      # security.js is the third browserless suite: it guards the shipped
      # security contract — the CSP meta's declared directives, zero inline
      # scripts/handlers, no eval surface — issue #369. Also browserless-first,
      # same reason as tokens.js and records.js.
      - name: security.js
        run: node test/security.js

      - name: mobile.js
        run: node test/mobile.js

      - name: overflow.js
        run: node test/overflow.js

      - name: desktop.js
        run: node test/desktop.js

      # month.js joined CI with issue #401: the suite was red on main for
      # weeks without anyone noticing, because nothing ran it. [M3]'s pins
      # follow B158's surface (today renders in #cal-today-board, not the
      # stack), so a band/stack change that breaks the month-view swap
      # fails here now. The other un-CI'd suites are a separate owner call.
      - name: month.js
        run: node test/month.js

      - name: day-view-suffix.js
        run: node test/day-view-suffix.js

      # sw-update.js serves its own throwaway copy on SW_TEST_PORT; it doesn't
      # use the server above.
      - name: sw-update.js
        run: node test/sw-update.js
