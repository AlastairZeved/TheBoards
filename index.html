<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-visual: the soft keyboard resizes the visual
       viewport only, leaving window.innerHeight (and so the sheet) still while
       a note is being written. See DECISIONS B28. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-visual">
  <!-- One theme, one value (B48 halves B11): the OS chrome around the app is
       the room behind the page, and the room is the sky — the band's #020812
       doing B52's second job at the platform edge. -->
  <meta name="theme-color" content="#020812">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Zeved Boards</title>
  <!-- Social/AEO metadata (issue #244, audit #247 P2): description transcribed
       verbatim from manifest.json / docs/PRD.md §2.2. og:image is absolute —
       scrapers resolve relative URLs against the page, not always reliably. -->
  <!-- CSP derived from shipped code (audit #246 finding 1, owner-approved):
       index.html ships zero inline scripts, styles, or on*= handlers (grep
       2026-09-17); styles.css loads same-origin fonts and data: SVG noise
       backgrounds, hence img-src data:. JS CSSOM styling is not CSP-gated. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'">
  <meta name="description" content="A bounded page where a thought becomes a framed, movable, scalable note the instant it is typed.">
  <meta property="og:title" content="Zeved Boards">
  <meta property="og:description" content="A bounded page where a thought becomes a framed, movable, scalable note the instant it is typed.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://alastairzeved.github.io/TheBoards/">
  <meta property="og:image" content="https://alastairzeved.github.io/TheBoards/docs/brand/og-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Zeved Boards">
  <meta name="twitter:description" content="A bounded page where a thought becomes a framed, movable, scalable note the instant it is typed.">
  <meta name="twitter:image" content="https://alastairzeved.github.io/TheBoards/docs/brand/og-card.png">
  <link rel="canonical" href="https://alastairzeved.github.io/TheBoards/">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="author" href="humans.txt">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Board view: the single scaled page. Zero chrome (UIUX §1). -->
  <div id="board-view">
    <!-- Desktop-only board rail (issues #9/#10): a sunken, always-visible pane.
         Sits outside #board, so the gesture recognizer never sees its events.
         display:none unless html.desktop; hidden from AT off-desktop too. -->
    <aside id="pane" class="on-dark" aria-label="Boards">
      <!-- B118 (issue #211): the collapsed All-Boards face — B99's rail grammar
           on the pane. One tap expands; the pane's own name reads vertically.
           #pane-collapse is the expanded pane's arrow: the pane has no Back,
           the arrow IS the collapse affordance. -->
      <button type="button" id="pane-rail" aria-label="All Boards" aria-expanded="false"
              hidden>
        <span class="cdot" aria-hidden="true"></span>
        <span class="vlabel" aria-hidden="true">All Boards</span>
      </button>
      <!-- B134 (issue #259): the pane's collapse control sits at the pane's
           BOTTOM-RIGHT corner. B135 (issue #279): it reads `◀ Collapse` —
           mark first, pointing left, the calendar's `Collapse ▶` mirrored,
           because this rail collapses left. -->
      <div id="pane-cards"></div>
      <button type="button" id="pane-collapse" class="cal-act on-light" aria-label="Collapse the boards rail"
              hidden></button>
    </aside>

    <!-- The one logical 900x1000 page. transform:scale() applied in JS.
         .on-dark binds the ink pole for the water (UIUX §2.3); the lot and
         each note rebind .on-light at their own boundary. -->
    <div id="board" class="on-dark" role="application" aria-label="Board" aria-roledescription="spatial board">

      <!-- The four permanent anchors (PRD §6.1). contenteditable is toggled on
           in JS only while editing, so the gesture recognizer owns tap/drag/
           long-press without fighting native focus.

           The top band is drawn furniture, independent of content: a section
           ABOVE its rule (B47) — content, then the rule as the band's bottom
           edge, full width, with each header hanging just below it as a tight
           tab in the rule's own ink (B76) — the exact mirror of the Parking
           Lot closing the sheet's other end. The rule follows the zones in DOM
           order so it draws over a zone's overflowing content, and the card,
           last, occludes the rule. -->
      <div id="band-fill" aria-hidden="true"></div>

      <div class="band-zone" id="zone-components">
        <div class="anchor" id="anchor-components" data-anchor="components" tabindex="0"
             role="textbox" aria-multiline="true" aria-label="Components"></div>
        <div class="band-label on-light" aria-hidden="true">Components</div>
      </div>

      <div class="band-zone" id="zone-requirements">
        <div class="anchor" id="anchor-requirements" data-anchor="requirements" tabindex="0"
             role="textbox" aria-multiline="true" aria-label="Requirements"></div>
        <div class="band-label on-light" aria-hidden="true">Requirements</div>
      </div>

      <div id="band-rule" aria-hidden="true"></div>

      <div class="anchor" id="anchor-title" data-anchor="title"
           data-placeholder="What&rsquo;s up?" tabindex="0"
           role="textbox" aria-multiline="true" aria-label="Title"></div>

      <!-- The board's own actions, declared where a gesture used to hide them
           (issue #126, B83; three tabs since issue #140, B92 — two on desktop
           since issue #157, B100, where "All Boards" retires: the left rail
           already lists every category with every board). A flat-tab row
           hovering just above the Parking Lot — the mirror, at the sheet's
           other end, of the band's header tabs. "All Boards" toggles the list
           / lot-grid; "Export" opens the PDF · JSON choice; "Import"
           opens the file picker for a JSON backup. Native buttons with their
           own clicks: the recognizer ignores #board-actions through the
           onPointerDown passthrough (the #lot-menu precedent), so it earns no
           classifyTarget branch. The container is pointer-events:none like a
           .band-zone, so bare canvas beside the tabs still captures a note;
           only the tabs (and their §6 hit collars) are live. Glyph + label are
           filled from app.js's GLYPH/COPY, and the toggle's label is re-stated
           by syncBoardActions. .on-light rebinds the ink to --ink-dark on the
           --frame fill. The import input is the mechanism, never a control:
           display:none by nature of its work, driven only by the Import tab. -->
      <div id="board-actions" role="group" aria-label="Board actions">
        <button type="button" class="board-action on-light" id="action-boards"></button>
        <button type="button" class="board-action on-light" id="action-export"></button>
        <button type="button" class="board-action on-light" id="action-import"></button>
        <button type="button" class="board-action on-light" id="action-calendar"></button>
      </div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>

      <!-- Parking Lot zone (PRD §6.5). Unframed stacked lines on the water
           (B58); .on-dark keeps the light pole at the section's edge
           (UIUX §2.3). -->
      <div id="lot" class="on-dark" data-anchor="lot">
        <div id="lot-rule" aria-hidden="true"></div>
        <div id="lot-header" aria-hidden="true">Parking Lot</div>
        <div id="lot-items"></div>
        <!-- The All-Boards picker (issue #112 / B74; every picker surface since
             issue #157 / B100): the "All Boards" tab takes over the Parking Lot
             region as a 2x2 category grid, at the lot's current height. A
             transient nav surface drawn OVER the lot — it never replaces the
             board's own parking-lot data (#lot-items), which returns intact
             when the menu is dismissed. -->
        <div id="lot-menu" class="on-dark" role="menu" aria-label="All boards" hidden></div>
      </div>

      <!-- Free-canvas notes are injected here by app.js, absolutely positioned. -->
    </div>
  </div>

  <!-- Board list view (PRD §6.7 / UIUX §10): the only other screen, on the
       room's own ground (B52). No visible page heading — the three category
       heads say where you are, and the screen's own name is carried by this
       section's aria-label, for the readers that need one (issue #95, B66). -->
  <section id="list-view" class="on-dark" hidden aria-label="Boards">
    <div id="list-rows" role="list"></div>
  </section>

  <!-- Calendar view (issue #145): the 7-day rolling stack, the third screen.
       The owner's exit control (R1, renamed and reseated by B134, issue #259)
       is its visible way off — Collapse alone, rendered at the very BOTTOM of
       the view, below the month view, anchored left, reading `Collapse ▶`;
       Export remains reachable elsewhere and All Boards via the picker/rail.
       The stack renders one day card per
       rolling date, today first (R4 computes the window; nothing stored).
       Wide (issue #158, B99): the calendar is the mockup-6 standing RAIL —
       always visible at the viewport's right edge, its label reading
       vertically; tapping it expands the panel (the squeeze, R6). The rail
       chrome lives inside #cal-view so one element carries both states:
       #cal-rail is the collapsed face, #cal-top+#cal-stack the expanded
       panel's; on mobile both rail chrome pieces are inert (display:none)
       and the section behaves exactly as before. -->
  <section id="cal-view" class="on-dark" hidden aria-label="Calendar">
    <button type="button" id="cal-rail" aria-label="Calendar Board" aria-expanded="false"
            hidden>
      <span class="cdot" aria-hidden="true"></span>
      <span class="vlabel" aria-hidden="true">Calendar Board</span>
      <span class="cdate" aria-hidden="true"></span>
    </button>
    <!-- Issue #295 (B138): the recurring-reminders strip rides the slack
         issue #293 freed above the day list — mobile tier only (the wide
         panel keeps its own top-packing). Filled by renderCalReminders(). -->
    <div id="cal-reminders" role="group" aria-label="Recurring reminders"></div>
    <div id="cal-stack"></div>
    <div id="cal-month" role="group" aria-label="Month view"></div>
    <!-- B134 (issue #259): the exit control renders LAST — at the view's very
         bottom, below the month view, anchored left. Reads `Collapse ▶`. -->
    <div id="cal-top" role="group" aria-label="Calendar actions">
      <button type="button" class="cal-act on-light" id="cal-back"></button>
    </div>
  </section>

  <!-- Transient surfaces (elevation = "temporary, above the page", UIUX §2.4). -->
  <div id="menu" class="on-dark" role="menu" aria-label="Actions" hidden></div>
  <div id="toast" class="on-dark" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
